name: Android R1 Manager

on:
  push:
    branches:
      - "**"
    paths:
      - "android/r1-manager/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/r1-manager/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/r1-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: r1-manager-debug-apk
          path: android/r1-manager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-manager-reports
          path: |
            android/r1-manager/app/build/reports
            android/r1-manager/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7
