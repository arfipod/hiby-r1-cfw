name: Export latest exact main source snapshot

on:
  push:
    branches:
      - agent/r1-connectivity-suite
    paths:
      - .github/workflows/export-main-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify exact merged main tree
        run: |
          set -eux
          test "$(git rev-parse HEAD)" = "6c1862132316a3a3a4eeb9cd414e6bdb94a8638c"
          test "$(git rev-parse HEAD^{tree})" = "f32b20b16b772ff918854469136de7a634b784a9"
      - name: Package source
        run: |
          set -eux
          mkdir -p snapshot
          tar --exclude=.git --exclude=snapshot -czf snapshot/hiby-r1-cfw-main-6c186213.tar.gz .
          sha256sum snapshot/hiby-r1-cfw-main-6c186213.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-cfw-main-6c186213
          path: snapshot
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
