name: Export QEMU validation host helper

on:
  push:
    branches:
      - agent/r1-connectivity-suite
    paths:
      - .github/workflows/export-main-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate bubblewrap
        run: |
          set -eux
          if ! command -v bwrap; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          mkdir -p host-helper
          cp "$(command -v bwrap)" host-helper/bwrap
          chmod 0755 host-helper/bwrap
          file host-helper/bwrap
          ldd host-helper/bwrap | tee host-helper/ldd.txt
          sha256sum host-helper/bwrap > host-helper/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: r1-validation-bwrap-ubuntu2404
          path: host-helper
          if-no-files-found: error
          retention-days: 1
