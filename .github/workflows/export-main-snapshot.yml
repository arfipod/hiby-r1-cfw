name: Export OpenSSH validation helper

on:
  push:
    branches:
      - agent/r1-connectivity-suite
    paths:
      - .github/workflows/export-main-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Package OpenSSH client binaries
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y openssh-client
          mkdir -p host-helper
          cp "$(command -v ssh)" host-helper/ssh
          cp "$(command -v ssh-keygen)" host-helper/ssh-keygen
          chmod 0755 host-helper/ssh host-helper/ssh-keygen
          file host-helper/ssh host-helper/ssh-keygen
          ldd host-helper/ssh > host-helper/ssh-ldd.txt
          ldd host-helper/ssh-keygen > host-helper/ssh-keygen-ldd.txt
          sha256sum host-helper/ssh host-helper/ssh-keygen > host-helper/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: r1-validation-openssh-client-ubuntu2404
          path: host-helper
          if-no-files-found: error
          retention-days: 1
