name: Export static QEMU validation helper

on:
  push:
    branches:
      - agent/r1-connectivity-suite
    paths:
      - .github/workflows/export-main-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install static MIPS emulator
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          qemu=$(command -v qemu-mipsel-static)
          mkdir -p host-helper
          cp "$qemu" host-helper/qemu-mipsel
          chmod 0755 host-helper/qemu-mipsel
          file host-helper/qemu-mipsel | tee host-helper/file.txt
          grep -Eq 'static-pie linked|statically linked' host-helper/file.txt
          sha256sum host-helper/qemu-mipsel > host-helper/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: r1-validation-qemu-mipsel-static-ubuntu2404
          path: host-helper
          if-no-files-found: error
          retention-days: 1
