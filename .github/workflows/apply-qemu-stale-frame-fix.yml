name: Apply stale QEMU frame-state reset

on:
  push:
    branches:
      - agent/fix-qemu-readiness
    paths:
      - .github/workflows/apply-qemu-stale-frame-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qemu-readiness
          fetch-depth: 0

      - name: Clear stale volatile telemetry before process launch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/cfw_validate.py')
          text = path.read_text()
          old = '''    def start(self, *, stock_launcher: bool = False) -> Any:\n        if self.process is not None:\n            raise ValidationError(f"session {self.name} is already running")\n        self.runtime.parent.mkdir(parents=True, exist_ok=True)\n        log_path = self.evidence.logs_dir / f"{self.name}.log"\n'''
          new = '''    def start(self, *, stock_launcher: bool = False) -> Any:\n        if self.process is not None:\n            raise ValidationError(f"session {self.name} is already running")\n        self.runtime.parent.mkdir(parents=True, exist_ok=True)\n        # Several validation sessions deliberately reuse the same persistent\n        # runtime so launcher/user-data state survives a restart. Volatile\n        # framebuffer telemetry must not survive: otherwise the render-loop\n        # readiness fallback could accept the previous process's final frame\n        # before the new runner has reset its diagnostics.\n        try:\n            self.frame_state.unlink(missing_ok=True)\n        except OSError as error:\n            raise ValidationError(\n                f"cannot clear stale frame state for {self.name}: {error}"\n            ) from error\n        log_path = self.evidence.logs_dir / f"{self.name}.log"\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected QemuSession.start implementation')
          path.write_text(text.replace(old, new))
          PY
          python3 -m compileall -q tools/cfw_validate.py
          git rm .github/workflows/apply-qemu-stale-frame-fix.yml
          git add tools/cfw_validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reset stale QEMU frame telemetry"
          git push origin HEAD:agent/fix-qemu-readiness
