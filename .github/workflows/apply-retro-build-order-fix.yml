name: Apply deterministic Retro build-order fix

on:
  push:
    branches:
      - agent/fix-retro-build-order
    paths:
      - .github/workflows/apply-retro-build-order-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-retro-build-order
          fetch-depth: 0

      - name: Apply source and regression-test fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('tools/build-cfw-0.1.sh')
          text = build.read_text()
          old = '''    python3 "$repo_dir/tools/patch_r1_cfw_integration.py" "$root"\n    python3 "$retro_theme_tool" generate "$root" "$retro_theme_work"\n    python3 "$repo_dir/tools/patch_r1_launcher.py" generate "$root"\n    python3 "$retro_launcher_tool" generate "$root"\n'''
          new = '''    python3 "$repo_dir/tools/patch_r1_cfw_integration.py" "$root"\n    # Generate the stock CFW launcher assets first. Retro Handheld is derived\n    # from the finalized light/dark resource trees, so installing it before\n    # these 0664 CFW icons would make verification regenerate the same PNG\n    # bytes with different modes after candidate re-extraction.\n    python3 "$repo_dir/tools/patch_r1_launcher.py" generate "$root"\n    python3 "$retro_theme_tool" generate "$root" "$retro_theme_work"\n    python3 "$retro_launcher_tool" generate "$root"\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected build sequence; refusing automatic edit')
          build.write_text(text.replace(old, new))

          test = Path('tests/test_build_cfw_0_1.py')
          text = test.read_text()
          anchor = '''        for needle in required_before_build:\n            with self.subTest(needle=needle):\n                self.assertLess(prepare.index(needle), build)\n'''
          addition = '''\n        # Retro is generated from the finalized stock light/dark trees. The\n        # CFW launcher icons carry the stock resource mode (0664), so they must\n        # exist before Retro copies/transforms those trees or deterministic\n        # verification will see identical PNG bytes with different modes.\n        self.assertLess(\n            prepare.index('patch_r1_launcher.py" generate "$root"'),\n            prepare.index('"$retro_theme_tool" generate "$root"'),\n        )\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected test structure; refusing automatic edit')
          if 'verification will see identical PNG bytes with different modes' not in text:
              text = text.replace(anchor, anchor + addition)
          test.write_text(text)
          PY

          python3 -m unittest tests.test_build_cfw_0_1 -v
          git rm .github/workflows/apply-retro-build-order-fix.yml
          git add tools/build-cfw-0.1.sh tests/test_build_cfw_0_1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix deterministic Retro build order"
          git push origin HEAD:agent/fix-retro-build-order
