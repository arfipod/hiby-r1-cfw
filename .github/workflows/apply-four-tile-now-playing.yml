name: Apply four-tile Now Playing fix

on:
  push:
    branches: [fix/four-tile-now-playing-swipe]
    paths: [.github/workflows/apply-four-tile-now-playing.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/four-tile-now-playing-swipe
          fetch-depth: 0
      - name: Patch launcher horizontal page range
        shell: python
        run: |
          from pathlib import Path

          edits = {
              "tools/patch_r1_launcher.py": (
                  '("scroll_min_x", 0),',
                  '# Preserve the stock launcher/Now Playing horizontal page range.\n        ("scroll_min_x", -480),',
              ),
              "tools/patch_r1_retro_launcher.py": (
                  '("scroll_min_x", 0),',
                  '# Preserve the stock launcher/Now Playing horizontal page range.\n        ("scroll_min_x", -480),',
              ),
              "tests/test_patch_r1_launcher.py": (
                  'self.assertEqual(0, root.properties["scroll_min_x"])',
                  'self.assertEqual(-480, root.properties["scroll_min_x"])',
              ),
          }
          for filename, (old, new) in edits.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected match count in {filename}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          retro_test = Path("tests/test_retro_theme_integration.py")
          text = retro_test.read_text(encoding="utf-8")
          anchor = '        self.assertIn(\'"name":"launcher_apps_vg_step"\', compact)\n'
          assertion = '        self.assertIn(\'"scroll_min_x":-480\', compact)\n'
          if assertion not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("unexpected Retro test anchor count")
              retro_test.write_text(text.replace(anchor, anchor + assertion), encoding="utf-8")
      - name: Run launcher generator regression tests
        run: python3 -m unittest tests.test_patch_r1_launcher
      - name: Commit fix
        run: |
          set -eux
          rm .github/workflows/apply-four-tile-now-playing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix four-tile launcher swipe to Now Playing"
          git push origin HEAD:fix/four-tile-now-playing-swipe
