name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install firmware and emulator test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            bubblewrap genisoimage p7zip-full qemu-user squashfs-tools

      - name: Install UI preview dependency
        run: python -m pip install 'Pillow>=10,<13'

      - name: Prepare reproducible ISO and QEMU compatibility paths
        run: |
          mkdir -p "$RUNNER_TEMP/r1-ci-bin" \
            work/host-tools/qemu-user/usr/bin
          cat > "$RUNNER_TEMP/r1-ci-bin/genisoimage" <<EOF
          #!/bin/sh
          exec python3 "$GITHUB_WORKSPACE/tools/genisoimage_compat.py" "\$@"
          EOF
          chmod 0755 "$RUNNER_TEMP/r1-ci-bin/genisoimage"
          ln -sf "$(command -v qemu-mipsel)" \
            work/host-tools/qemu-user/usr/bin/qemu-mipsel
          echo "$RUNNER_TEMP/r1-ci-bin" >> "$GITHUB_PATH"

      - name: Check Python syntax
        run: python -m compileall -q tools tests

      - name: Check POSIX shell syntax
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -qx '#!/bin/sh'; then
              sh -n "$file"
            fi
          done < <(find tools mods tests -type f -print0)

      - name: Run unit and synthetic firmware round-trip tests
        run: python -m unittest discover -s tests -v

      - name: Reject accidentally committed firmware and build trees
        run: |
          if find . -path ./.git -prune -o \
              \( -name '*.upt' -o -path './work/*' \) -print -quit | grep -q .; then
            echo 'Firmware images or work/ build artifacts must not be committed.' >&2
            exit 1
          fi
