name: Strengthen four-tile page-range regression

on:
  push:
    branches: [fix/four-tile-now-playing-swipe]
    paths: [.github/workflows/strengthen-four-tile-test.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/four-tile-now-playing-swipe
          fetch-depth: 0
      - name: Assert the exact four-tile horizontal page range
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_patch_r1_launcher.py")
          text = path.read_text(encoding="utf-8")
          old = '                self.assertEqual(50, root.properties["scroll_min_y"])\n                self.assertEqual("scroll", root.properties["flag"])'
          new = '                self.assertEqual(50, root.properties["scroll_min_y"])\n                self.assertEqual(0, root.properties["scroll_max_x"])\n                self.assertEqual(-480, root.properties["scroll_min_x"])\n                self.assertEqual("scroll", root.properties["flag"])'
          if text.count(old) != 1:
              raise SystemExit("unexpected default-layout assertion anchor")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Run focused regression
        run: python3 -m unittest tests.test_patch_r1_launcher
      - name: Commit regression and remove staging workflow
        run: |
          set -eux
          rm .github/workflows/strengthen-four-tile-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen four-tile Now Playing page-range test"
          git push origin HEAD:fix/four-tile-now-playing-swipe
