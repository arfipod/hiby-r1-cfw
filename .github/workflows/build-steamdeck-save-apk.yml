name: Build Steam Deck Elden Ring Save APK

on:
  push:
    branches:
      - build/export-fc65-source
    paths:
      - 'steamdeck-save-downloader/**'
      - '.github/workflows/build-steamdeck-save-apk.yml'
  pull_request:
    branches:
      - build/export-fc65-source
    paths:
      - 'steamdeck-save-downloader/**'
      - '.github/workflows/build-steamdeck-save-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: steamdeck-save-downloader
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SteamDeckEldenRingSave-apk
          path: steamdeck-save-downloader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
